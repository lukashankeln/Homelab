apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifi
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: unifi
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.4.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: ghcr.io
          repository: unihosted/unifi-os-server-docker
          tag: latest # datasource=docker depName=ghcr.io/unihosted/unifi-os-server-docker
        application:
          port: 443
          strategy: Recreate
          probe:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
        clusterip:
          enabled: true
          port: 443
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        env:
          - name: TZ
            value: Europe/Amsterdam
          - name: UOS_SYSTEM_IP
            value: "127.0.0.1"
          - name: EXPOSE_NETWORK_APP
            value: "true"
          - name: MONGO_INTERNAL
            value: "false"
        securityContext:
          pod:
            runAsUser: 0
          container:
            privileged: true
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
        volumeMounts:
          - name: cgroup
            mountPath: /sys/fs/cgroup
          - name: uos-data
            mountPath: /var/lib/uosserver
          - name: uos-data
            mountPath: /var/lib/unifi
          - name: app-data
            mountPath: /data
          - name: run
            mountPath: /run
          - name: tmp
            mountPath: /tmp
          - name: journal
            mountPath: /var/lib/journal
          - name: unifi-tmp
            mountPath: /var/opt/unifi/tmp
        volumes:
          - name: cgroup
            hostPath:
              path: /sys/fs/cgroup
              type: Directory
          - name: uos-data
            persistentVolumeClaim:
              claimName: unifi-uos-data
          - name: app-data
            persistentVolumeClaim:
              claimName: unifi-app-data
          - name: run
            emptyDir:
              medium: Memory
          - name: tmp
            emptyDir:
              medium: Memory
          - name: journal
            emptyDir:
              medium: Memory
          - name: unifi-tmp
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
