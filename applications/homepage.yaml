apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.6.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: ghcr.io
          repository: gethomepage/homepage
          tag: v2.4.0 # datasource=docker depName=ghcr.io/gethomepage/homepage versioning=docker
        application:
          port: 3000
          probe:
            path: /api/healthcheck
          additionalLabels:
            network-policy/deny-all: "true"
            network-policy/egress-dns: "true"
            network-policy/egress-ingress-controller: "true"
            network-policy/ingress-port: "3000"
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - dash.hankeln.work
        env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: "*" # healthchecks use the pod ip as host...
          - name: LOG_TARGETS
            value: stdout
          - name: PGID
            value: "1000"
          - name: PUID
            value: "1000"
        configMaps:
          - name: homepage
            mountPath: /app/config
            data:
              settings.yaml: |
                title: "Hankeln Homelab Dashboard"
                headerStyle: boxed
                theme: dark
                iconStyle: colored
                layout:
                  Infrastructure:
                  Monitoring:
                  Applications:
                  Home Automation:
              bookmarks.yaml: |
                - Developer:
                    - Gitea:
                        - abbr: GIT
                          href: https://git.hankeln.work/
                    - Stack Overflow:
                        - abbr: SO
                          href: https://stackoverflow.com/
                    - Docker Hub:
                        - abbr: DH
                          href: https://hub.docker.com/
              services.yaml: |
                - Infrastructure:
                    - ArgoCD:
                        href: https://argocd.hankeln.work
                        description: GitOps controller
                        icon: si-argo
                    - Gitea:
                        href: https://git.hankeln.work
                        description: Self-hosted Git
                        icon: gitea.png
                    - Vault:
                        href: https://vault.hankeln.work
                        description: Secret management
                        icon: vault.png
                    - Argo Workflows:
                        href: https://argo-workflows.hankeln.work
                        description: Workflow engine
                        icon: si-argo
                - Monitoring:
                    - Grafana:
                        href: https://grafana.hankeln.work
                        description: Metrics dashboards
                        icon: grafana.png
                    - Prometheus:
                        href: https://prometheus.hankeln.work
                        description: Metrics storage
                        icon: prometheus.png
                        widget:
                          type: prometheus
                          url: https://prometheus.hankeln.work
                    - Alertmanager:
                        href: https://alertmanager.hankeln.work
                        description: Alert routing
                        icon: alertmanager.png
                    - Gatus:
                        href: https://status.hankeln.work
                        description: Uptime monitoring
                        icon: gatus.png
                        widget:
                          type: gatus
                          url: https://status.hankeln.work
                    - Hubble:
                        href: https://hubble.hankeln.work
                        description: Cilium network flows
                        icon: cilium.png
                - Applications:
                    - Kanboard:
                        href: https://board.hankeln.work
                        description: Kanban project management
                        icon: kanboard.png
                    - Ntfy:
                        href: https://ntfy.hankeln.work
                        description: Push notifications
                        icon: ntfy.png
                    - Docker Registry:
                        href: https://docker.hankeln.work
                        description: Container image registry
                        icon: docker.png
                    - Movement Detector:
                        href: https://motion.hankeln.work
                        description: NVR / motion detection
                        icon: motioneye.png
                    - Homelab Agent:
                        href: https://agent.hankeln.work
                        description: AI coding agent
                        icon: claude-ai.png
                - Home Automation:
                    - NAS:
                        href: http://192.168.1.112:8000/portal/
                        description: Network Attached Storage
                        icon: synology.png
                    - Home Assistant:
                        href: https://hassio.hankeln.work/
                        description: Home automation platform
                        icon: home-assistant.png
                    - Freebox:
                        href: http://mafreebox.freebox.fr/
                        description: Freebox management interface
                        icon: freebox.png
              widgets.yaml: |
                - search:
                    provider: duckduckgo
                    target: _blank
                - datetime:
                    format:
                      dateStyle: long
                      timeStyle: short
                      hour12: false
              kubernetes.yaml: |
                ---
              proxmox.yaml: |
                ---
              docker.yaml: |
                ---
              custom.css: ""
              custom.js: ""
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
