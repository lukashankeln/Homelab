apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ntfy
  namespace: argocd
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: ntfy
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.7.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: docker.io
          repository: binwiederhier/ntfy
          tag: v2.38.2 # datasource=docker depName=docker.io/binwiederhier/ntfy versioning=docker
        application:
          port: 8080
          args: ["serve"]
          additionalLabels:
            network-policy/ingress-port: "8080"
            network-policy/ingress-cluster-port-8080: "true"
          probe:
            path: /v1/health
            startup:
              initialDelaySeconds: 0
        resources:
          requests:
            memory: "30Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - ntfy.hankeln.work
        env:
          - name: NTFY_LISTEN_HTTP
            value: ":8080"
          - name: NTFY_BASE_URL
            value: "https://ntfy.hankeln.work"
          - name: NTFY_UPSTREAM_BASE_URL
            value: "https://ntfy.sh"
          - name: NTFY_BEHIND_PROXY
            value: "true"
          - name: NTFY_CACHE_FILE
            value: /var/cache/ntfy/cache.db
          - name: NTFY_ATTACHMENT_CACHE_DIR
            value: /var/cache/ntfy/attachments
          # auth: users/tokens are provisioned declaratively on every start from Vault (notifications/ntfy)
          - name: NTFY_AUTH_FILE
            value: /var/cache/ntfy/user.db
          - name: NTFY_AUTH_DEFAULT_ACCESS
            value: "deny-all"
          - name: NTFY_AUTH_USERS
            valueFrom:
              secretKeyRef:
                name: ntfy-auth
                key: NTFY_AUTH_USERS
          - name: NTFY_AUTH_TOKENS
            valueFrom:
              secretKeyRef:
                name: ntfy-auth
                key: NTFY_AUTH_TOKENS
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        volumeMounts:
          - name: cache
            mountPath: /var/cache/ntfy
        volumes:
          - name: cache
            emptyDir: {}
