apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: too-restful-api
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: too-restful-api
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.7.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: docker.io
          repository: nginx/nginx-unprivileged
          tag: 1.31.8
        application:
          port: 8080
          probe:
            path: /alive
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - json.hankeln.work
        configMaps:
          - name: html
            mountPath: /usr/share/nginx/html
            data:
              dotnet-version.json: |
                {
                  "releases": [
                    {
                      "version" : "8.0"
                    },
                    {
                      "version" : "9.0"
                    },
                    {
                      "version" : "10.0"
                    }
                  ]
                }
          - name: nginx-conf
            mountPath: /etc/nginx/conf.d
            data:
              default.conf: |
                server {
                    listen 8080;
                    server_name _;

                    root /usr/share/nginx/html;

                    location /alive {
                        default_type text/plain;
                        return 200 "alive";
                    }

                    location / {
                        try_files $uri $uri/ =404;
                    }
                }
        resources:
          requests:
            memory: "25Mi"
            cpu: "10m"
          limits:
            memory: "50Mi"
            cpu: "20m"
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        volumeMounts:
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: tmp
            emptyDir: {}
