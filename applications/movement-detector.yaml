apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: movement-detector
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: webservice
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.6.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: docker-registry.hankeln.work
          repository: petit-nvr
          tag: main
          pullPolicy: Always
        persistence:
          enabled: true
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - motion.hankeln.work
        application:
          port: 8080
          additionalLabels:
            network-policy/deny-all: "true"
            network-policy/egress-dns: "true"
            network-policy/egress-world: "true"
            network-policy/ingress-port: "8080"
          probe:
            startup:
              enabled: false
            readiness:
              enabled: false
            liveness:
              enabled: false
        configMaps:
          - name: camera-config
            data:
              config.yaml: |
                global:
                  output_dir: /data
                  default_fps: 15.0
                  motion_threshold: 1500
                  blur_size: 7
                  cooldown_secs: 10.0
                  dilate_iters: 2
                  clip_duration: 5.0
                  pre_buffer_secs: 5.0
                  max_videos: 100
                  stale_days: 30

                cameras:
                  - name: webcam
                    url: http://192.168.1.121:1984/api/stream.mjpeg?src=webcam
                    motion_threshold: 30
        env:
          - name: CAMERA_CONFIG
            value: /config/camera-config/config.yaml
        volumeMounts:
          - name: deps
            mountPath: /deps
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: deps
            emptyDir: {}
          - name: tmp
            emptyDir: {}
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
