apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kube-prometheus-stack
    name: in-cluster
  project: hankeln
  revisionHistoryLimit: 1
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].failurePolicy
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].failurePolicy
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
  source:
    # Repository: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
    # Artifacthub: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
    # Values: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 94.1.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        alertmanager:
          route:
            main:
              enabled: true
              parentRefs:
                - name: cilium-gateway
                  namespace: cilium
              hostnames: [alertmanager.hankeln.work]
          alertmanagerSpec:
            configSecret: alertmanager
            logFormat: json
            logLevel: warn
            externalUrl: https://alertmanager.hankeln.work
            retention: 336h
            resources:
              requests:
                cpu: 11m
                memory: 80Mi
            initContainers:
              - name: init-config-reloader
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: nfs-client
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi
        grafana:
          resources:
            requests:
              cpu: 100m
              memory: 220Mi
            limits:
              cpu: 200m
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          sidecar:
            dashboards:
              provider:
                foldersFromFilesStructure: true
              folder: /grafana/dashboards
              folderAnnotation: "grafana_folder"
              annotations:
                grafana_folder: "Kubernetes Resources"
              extraMounts:
                - name: tmp
                  mountPath: /tmp
            datasources:
              extraMounts:
                - name: tmp
                  mountPath: /tmp
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: false
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                memory: 180Mi
          admin:
            existingSecret: grafana-admin-credentials
            userKey: user
            passwordKey: password
          defaultDashboardsTimezone: cet
          route:
            main:
              enabled: true
              parentRefs:
                - name: cilium-gateway
                  namespace: cilium
              hostnames: [grafana.hankeln.work]
          # Pocket ID client ID/secret as GF_AUTH_GENERIC_OAUTH_CLIENT_ID/_SECRET (custom-resources/external-secrets/grafana-oauth.yaml)
          envFromSecrets:
            - name: grafana-oauth
          grafana.ini:
            server:
              root_url: https://grafana.hankeln.work
            users:
              auto_assign_org_role: Admin
            # SSO via Pocket ID; only homelab_admins get in (as Grafana server admin), everyone else is rejected
            auth.generic_oauth:
              enabled: true
              name: Pocket ID
              allow_sign_up: true
              use_pkce: true
              scopes: openid profile email groups
              auth_url: https://id.hankeln.work/authorize
              token_url: https://id.hankeln.work/api/oidc/token
              api_url: https://id.hankeln.work/api/oidc/userinfo
              signout_redirect_url: https://id.hankeln.work/api/oidc/end-session
              login_attribute_path: preferred_username
              name_attribute_path: name
              email_attribute_path: email
              groups_attribute_path: groups
              role_attribute_path: contains(groups[*], 'homelab_admins') && 'GrafanaAdmin'
              role_attribute_strict: true
              allow_assign_grafana_admin: true
            log:
              mode: console
            log.console:
              format: json
              level: warn
        prometheus:
          route:
            main:
              enabled: true
              parentRefs:
                - name: cilium-gateway
                  namespace: cilium
              hostnames: [prometheus.hankeln.work]
          prometheusSpec:
            resources:
              requests:
                cpu: 150m
                memory: 250Mi
              limits:
                cpu: 1000m
                memory: 2000Mi
            containerSecurityContext:
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            initContainers:
              - name: init-config-reloader
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
            additionalArgs:
              - name: web.enable-remote-write-receiver
            retention: 7d
            scrapeInterval: 60s
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              # Talos kubelet has no extraMount for /var/local-path-provisioner, so subPath
              # dirs get created inside the kubelet container (root-owned, not on host).
              disableMountSubPath: true
              volumeClaimTemplate:
                spec:
                  # TSDB on NFS is unsupported upstream and saturated the node's NFS client
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 20Gi
            logFormat: json
            logLevel: warn
        prometheus-node-exporter:
          # Repository: https://github.com/prometheus/node_exporter
          # ArtifactHub: https://artifacthub.io/packages/helm/prometheus-community/prometheus-node-exporter
          # Values: https://github.com/prometheus-community/helm-charts/blob/main/charts/prometheus-node-exporter/values.yaml
          resources:
            requests:
              cpu: 5m
              memory: 60Mi
          extraArgs:
            - --log.level=warn
            - --log.format=json
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containerSecurityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        kubeControllerManager:
          service:
            port: 10257
            targetPort: 10257
            ipFamilyPolicy: SingleStack
            ipFamilies: [IPv4]
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        kubeScheduler:
          service:
            port: 10259
            targetPort: 10259
            ipFamilyPolicy: SingleStack
            ipFamilies: [IPv4]
          serviceMonitor:
            https: true
            insecureSkipVerify: true
        defaultRules:
          rules:
            kubeProxy: false
            # These SLO rules scan apiserver_request_* over the full retention every
            # evaluation (~4min/round on NFS), saturating the node's NFS client and
            # slowing co-located workloads (Gitea, CNPG primary).
            kubeApiserverAvailability: false
            kubeApiserverBurnrate: false
            # KubeAPIErrorBudgetBurn alerts depend on the burnrate recording rules above
            kubeApiserverSlos: false
          disabled:
            # TODO: reactivate once a third node is added to the cluster
            KubeMemoryOvercommit: true
        prometheusOperator:
          tls:
            enabled: true
          prometheusConfigReloader:
            resources:
              requests:
                cpu: 10m
                memory: 20M
              limits:
                cpu: 10m
                memory: 50M
          resources:
            requests:
              cpu: 30m
              memory: 60M
            limits:
              cpu: 100m
              memory: 400M
          securityContext:
            runAsNonRoot: true
          admissionWebhooks:
            enabled: true
            failurePolicy: "Ignore"
            certManager:
              enabled: true
            patch:
              enabled: true
              resources:
                requests:
                  cpu: 10m
                  memory: 20M
          logFormat: json
          logLevel: warn
