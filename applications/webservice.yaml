apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webservice
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: webservice
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.7.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: docker-registry.hankeln.work
          repository: webservice/server
          tag: 4.1.0 # datasource=docker depName=docker-registry.hankeln.work/webservice/server versioning=docker
        persistence:
          enabled: true
          mountPath: /pdf
        application:
          port: 5090
          additionalLabels:
            network-policy/deny-all: "true"
            network-policy/egress-dns: "true"
            network-policy/egress-world: "true"
            network-policy/egress-otel: "true"
            network-policy/egress-postgres: "true"
            network-policy/egress-ingress-controller: "true"
            network-policy/ingress-port: "5090"
            network-policy/ingress-cluster-port-5090: "true"
        resources:
          requests:
            memory: "250Mi"
            cpu: "100m"
          limits:
            memory: "350Mi"
            cpu: "200m"
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - web.hankeln.work
        env:
          # DOTNET
          - name: DOTNET_gcServer
            value: "1"
          - name: DOTNET_GCHeapCount
            value: "c"
          - name: ASPNETCORE_HTTP_PORTS
            value: "5090"
          # LOGGING
          - name: Logging__LogLevel__Default
            value: "Information"
          - name: Logging__LogLevel__Microsoft.AspNetCore
            value: "Warning"

          # Obsidian
          - name: WebService__ApplicationOptions__ObsidianPath
            value: /vault
          - name: WebService__ApplicationOptions__ObsidianGitToken
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: GIT_TOKEN
          - name: WebService__ApplicationOptions__ObsidianGitRepositoryUrl
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: GIT_URL
          # pdf storage
          - name: PDF_STORAGE_PATH
            value: /pdf
          # Postgres
          - name: ConnectionStrings__WebService
            valueFrom:
              secretKeyRef:
                name: postgres-connection
                key: PostgresConnectionString
        securityContext:
          container:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        volumeMounts:
          - name: obsidian
            mountPath: /vault
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: obsidian
            emptyDir: {}
          - name: tmp
            emptyDir: {}
        initContainers:
          - name: migrations
            image: docker-registry.hankeln.work/webservice/migrations:4.1.0 # renovate
            env:
              # OTEL
              - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
                value: "true"
              - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
                value: "true"
              - name: OTEL_EXPORTER_OTLP_ENDPOINT
                value: "http://aspire-dashboard-otlp-clusterip.aspire-dashboard.svc.cluster.local:8080"
              - name: OTEL_SERVICE_NAME
                value: "prod:WebService.Migrations"
              - name: OTEL_EXPORTER_OTLP_HEADERS
                value: "x-otlp-api-key=aspire"
              # postgres
              - name: ConnectionStrings__WebService
                valueFrom:
                  secretKeyRef:
                    name: postgres-connection
                    key: PostgresConnectionString
