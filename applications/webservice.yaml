apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webservice
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: webservice
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
  source:
    repoURL: https://kube-the-home.github.io/generic-helm/
    targetRevision: 2.7.0
    chart: generic
    helm:
      valuesObject:
        image:
          registry: docker-registry.hankeln.work
          repository: webservice/server
          tag: 6.1.0 # datasource=docker depName=docker-registry.hankeln.work/webservice/server versioning=docker
        persistence:
          enabled: true
          mountPath: /pdf
        application:
          port: 5090
          additionalLabels:
            network-policy/deny-all: "true"
            network-policy/egress-dns: "true"
            network-policy/egress-world: "true"
            network-policy/egress-otel: "true"
            network-policy/egress-postgres: "true"
            network-policy/egress-ingress-controller: "true"
            network-policy/egress-cluster-port-8080: "true"
            network-policy/ingress-port: "5090"
            network-policy/ingress-cluster-port-5090: "true"
        resources:
          requests:
            memory: "250Mi"
            cpu: "100m"
          limits:
            memory: "350Mi"
            cpu: "200m"
        route:
          enabled: true
          parentRefs:
            - name: cilium-gateway
              namespace: cilium
          hostnames:
            - web.hankeln.work
        env:
          # DOTNET
          - name: DOTNET_gcServer
            value: "1"
          - name: DOTNET_GCHeapCount
            value: "c"
          - name: ASPNETCORE_HTTP_PORTS
            value: "5090"
          # LOGGING
          - name: Logging__LogLevel__Default
            value: "Information"
          - name: Logging__LogLevel__Microsoft.AspNetCore
            value: "Warning"
          - name: Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command
            value: "Warning"

          # Obsidian
          - name: WebService__ApplicationOptions__ObsidianPath
            value: /vault/notes
          - name: WebService__ApplicationOptions__ObsidianGitToken
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: GIT_TOKEN
          - name: WebService__ApplicationOptions__ObsidianGitRepositoryUrl
            valueFrom:
              secretKeyRef:
                name: git-credentials
                key: GIT_URL
          - name: WebService__ApplicationOptions__TodoSyncEnabled
            value: "true"
          # ntfy
          - name: WebService__ApplicationOptions__NtfyUrl
            value: https://ntfy.hankeln.work/webservice
          - name: WebService__ApplicationOptions__NtfyToken
            valueFrom:
              secretKeyRef:
                name: ntfy-credentials
                key: NTFY_TOKEN
          # OIDC login via Pocket ID (ADR-012); the server refuses to start if one is missing
          - name: WebService__Oidc__Authority
            value: https://id.hankeln.work
          - name: WebService__Oidc__ClientId
            valueFrom:
              secretKeyRef:
                name: webservice-oidc
                key: OIDC_CLIENT_ID
          - name: WebService__Oidc__ClientSecret
            valueFrom:
              secretKeyRef:
                name: webservice-oidc
                key: OIDC_CLIENT_SECRET
          # pdf storage
          - name: PDF_STORAGE_PATH
            value: /pdf
          # Postgres
          - name: ConnectionStrings__WebService
            valueFrom:
              secretKeyRef:
                name: postgres-connection
                key: PostgresConnectionString
        securityContext:
          pod:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            fsGroup: 1654
            seccompProfile:
              type: RuntimeDefault
          container:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        volumeMounts:
          - name: obsidian
            mountPath: /vault
          - name: tmp
            mountPath: /tmp
        volumes:
          - name: obsidian
            emptyDir: {}
          - name: tmp
            emptyDir: {}
        initContainers:
          - name: migrations
            image: docker-registry.hankeln.work/webservice/migrations:6.1.0 # renovate
            env:
              # postgres
              - name: ConnectionStrings__WebService
                valueFrom:
                  secretKeyRef:
                    name: postgres-connection
                    key: PostgresConnectionString
