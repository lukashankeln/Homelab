apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uzi
  namespace: argocd
  finalizers:
    - resources-finalizers.argocd.argoproj.io
spec:
  project: hankeln
  revisionHistoryLimit: 1
  destination:
    name: in-cluster
    namespace: uzi
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
    syncOptions:
      - ServerSideApply=true
  source:
    repoURL: oci://ghcr.io/vtmocanu/uzi/uzi
    targetRevision: 0.86.0-rc.19
    path: .
    helm:
      valuesObject:
        secrets:
          mode: existing

        api:
          # Required for hosted k8s workers below: without it they'd be admitted to
          # the api's plaintext port, which the chart refuses outright. No internal
          # CA exists here (the only ClusterIssuer is the public ACME one, which
          # can't issue for a cluster-internal name), so this is left to the chart's
          # own self-signed chain (api.tls.certManager.issuerRef empty, the default).
          tls:
            enabled: true
          config:
            FRONTEND_ORIGIN: https://uzi.hankeln.work
            # The web pods' own pod-CIDR (Talos default, .talos/controlplane.yaml):
            # web nginx is the only reverse proxy in front of the api, so this is all
            # that must be trusted for X-Forwarded-For.
            TRUSTED_PROXIES: "10.244.0.0/16"
          # Off: this is a single-tenant homelab cluster (every workload is mine), not
          # a shared multi-tenant cluster where another pod could spoof X-Forwarded-For
          # by hitting the api Service directly. Enabling it correctly also needs the
          # Talos node InternalIP CIDR in probeCIDRs (cluster-dependent, unconfirmed
          # here for Cilium's probe-traffic exemption) or the api can fail kubelet
          # startup probes.
          networkPolicy:
            enabled: false
          # Required at boot; optional one-time admin + Claude OAuth seed. All four
          # keys come from custom-resources/external-secrets/uzi.yaml (vault key /uzi).
          secretEnv:
            JWT_SECRET: JWT_SECRET
            UZI_SECRET_KEY: UZI_SECRET_KEY
            UZI_SEED_EMAIL: UZI_SEED_EMAIL
            UZI_SEED_PASSWORD: UZI_SEED_PASSWORD
            UZI_SEED_NAME: UZI_SEED_NAME
            UZI_SEED_ANTHROPIC_TOKEN: UZI_SEED_ANTHROPIC_TOKEN

        web:
          ingress:
            enabled: false
          httpRoute:
            enabled: true
            hostnames:
              - uzi.hankeln.work
            parentRefs:
              - name: cilium-gateway
                namespace: cilium

        # CloudNativePG, bundled as a subchart dependency of this chart (single
        # replica, dev-cluster-style sizing — this is a homelab, not an HA deploy).
        database:
          mode: cnpg
        postgres:
          enabled: true
          cluster:
            instances: 1
            # This cluster's CNPG ClusterImageCatalog (custom-resources/postgres-operator)
            # pins the same image for major 16; kept explicit here since the chart's own
            # default is empty.
            imageName: ghcr.io/cloudnative-pg/postgresql:16.15
          # No S3 target configured for this homelab yet.
          backups:
            enabled: false

        # Hosted k8s workers: the controller (the only uzi component holding a kube
        # credential) provisions worker pods in a dedicated uzi-workers namespace on
        # demand, instead of running `docker compose --profile agent` on a laptop.
        workers:
          enabled: true
          # This cluster's CNI is Cilium, not Antrea/OVN — the only two providers the
          # chart's FQDN egress allowlist (worker-fqdn-egress.yaml) supports. Without
          # that mechanism, the chart's own CNI-independent default-deny floor would
          # leave workers able to reach only DNS + the api — no Anthropic, no git
          # remote, nothing. Turning the floor off gives workers the same
          # unrestricted egress every other workload in this single-tenant cluster
          # already has (nothing else here is fenced either); fqdnEgress stays off
          # too since it would render nothing useful on this CNI anyway.
          networkPolicy:
            enabled: false
          # This is a 3-node homelab (16GB RAM each), not dev-cluster: the chart's
          # default quota (20 CPU / 280Gi mem, sized for 20 largest-preset `l`
          # workers) would vastly oversubscribe it. Sized here for 2 worst-case `l`
          # workers (14Gi mem / 50Gi data + 20Gi nix each) — enough headroom for a
          # roll without blocking it — not a reservation, just the admission ceiling.
          # In practice, request size `s` or `m` workers given the hardware.
          quota:
            enabled: true
            requestsCPU: "2"
            requestsMemory: 8Gi
            requestsStorage: 100Gi
            persistentVolumeClaims: "4"
            deployments: "2"
