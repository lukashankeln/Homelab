version: "v1alpha1"

discovery:
  paths: ["."]
  exclude:
    - "**/.git/**"

render:
  helm:
    kubernetes_version: "1.36.0"
    include_crds: true
  subprocess_fallback: false

rules:
  catalogs:
    cis:
      enabled: true
  built_in:
    no_latest_tag:
      enabled: true
      severity: error
    resource_requests:
      enabled: true
      severity: warning
    deprecated_apis:
      enabled: true
      severity: error
  exceptions:
    - rule: cis-5.2.12-hostpath-volumes
      resources:
        - kind: DaemonSet
          namespace: cilium
          name: cilium
          reason: "Cilium CNI requires hostPath access to manage node networking"
        - kind: DaemonSet
          namespace: cilium
          name: cilium-envoy
          reason: "Cilium Envoy requires hostPath access to manage node networking"
        - kind: DaemonSet
          namespace: kube-prometheus-stack
          name: kube-prometheus-stack-prometheus-node-exporter
          reason: "node-exporter requires hostPath access to read host metrics"
        - kind: DaemonSet
          namespace: mogenius
          name: mogenius-operator-node-metrics
          reason: "mogenius node-metrics requires hostPath access to read host metrics"
    - rule: cis-5.2.2-privileged-containers
      resources:
        - kind: DaemonSet
          namespace: cilium
          name: cilium
          reason: "Cilium CNI requires privileged access to configure node networking"
        - kind: StatefulSet
          namespace: gitea
          name: gitea-actions-runner
          reason: "Gitea Actions runner requires privileged access to run CI jobs"
    - rule: cis-5.2.5-host-network
      resources:
        - kind: DaemonSet
          namespace: cilium
          name: cilium
          reason: "Cilium CNI requires host network access to manage node networking"
        - kind: DaemonSet
          namespace: cilium
          name: cilium-envoy
          reason: "Cilium Envoy requires host network access to manage node networking"
        - kind: Deployment
          namespace: cilium
          name: cilium-operator
          reason: "Cilium operator requires host network access to manage node networking"
        - kind: DaemonSet
          namespace: kube-prometheus-stack
          name: kube-prometheus-stack-prometheus-node-exporter
          reason: "node-exporter requires host network access to read host metrics"
        - kind: DaemonSet
          namespace: mogenius
          name: mogenius-operator-node-metrics
          reason: "mogenius node-metrics requires host network access to read host metrics"
    - rule: cis-5.2.3-host-pid
      resources:
        - kind: DaemonSet
          namespace: kube-prometheus-stack
          name: kube-prometheus-stack-prometheus-node-exporter
          reason: "node-exporter requires host PID namespace to read host process metrics"
  custom: []
    # - id: renovate-node-selector
    #   description: "RenovateJobs must have a node selector to ensure they run on the correct node"
    #   severity: error
    #   match:
    #     kinds: [RenovateJob]
    #   expression: "has(resource.spec.nodeSelector) && size(resource.spec.nodeSelector) > 0"
    #   message: "{{ .kind }}/{{ .name }} must have a node selector defined"


output:
  format: text
  color: auto
  summary: true

fail_on:
  - error
