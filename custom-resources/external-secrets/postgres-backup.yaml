apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-webservice
  namespace: argo-workflows
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - remoteRef:
        key: /postgres-backup/webservice
        property: POSTGRES_USER
      secretKey: POSTGRES_USER
    - remoteRef:
        key: /postgres-backup/webservice
        property: POSTGRES_PASSWORD
      secretKey: POSTGRES_PASSWORD
  target:
    creationPolicy: Owner
    deletionPolicy: Merge
    name: postgres-secret
    template:
      mergePolicy: Merge
      data:
        POSTGRES_DB: webservice
        POSTGRES_HOST: webservice-postgresql-rw.webservice.svc.cluster.local
        BACKUP_NAME: webservice
---
