apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: kube-prometheus-stack
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - remoteRef:
        key: /notifications/ntfy
        property: NTFY_TOKEN
      secretKey: ntfy_token
  target:
    creationPolicy: Owner
    deletionPolicy: Merge
    name: alertmanager
    template:
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          route:
            group_by:
              - alertname
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 1d
            receiver: "null"
            routes:
              - receiver: "null"
                matchers:
                  - alertname="Watchdog"
                continue: false
              - receiver: ntfy
                matchers:
                  - severity =~ "warning|critical"
                continue: false
          receivers:
            - name: "null"
            - name: ntfy
              webhook_configs:
                - url: "http://ntfy.ntfy.svc.cluster.local:8080/alerts?template=alertmanager"
                  send_resolved: true
                  http_config:
                    authorization:
                      type: Bearer
                      credentials: "{{ .ntfy_token }}"
