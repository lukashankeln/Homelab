# Vault /Gitea:
#   OIDC_CLIENT_ID      client ID of the "Gitea" OIDC client in Pocket ID
#   OIDC_CLIENT_SECRET  its client secret
# The Gitea chart expects the keys "key" and "secret".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oauth-pocket-id
  namespace: gitea
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - remoteRef:
        key: /Gitea
        property: OIDC_CLIENT_ID
      secretKey: key
    - remoteRef:
        key: /Gitea
        property: OIDC_CLIENT_SECRET
      secretKey: secret
  target:
    creationPolicy: Owner
    deletionPolicy: Merge
    name: gitea-oauth-pocket-id
