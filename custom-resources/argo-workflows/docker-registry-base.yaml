apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: docker-registry-base
  namespace: argo-workflows
spec:
  entrypoint: cleanup
  serviceAccountName: argo-workflow-executor
  arguments:
    parameters:
      - name: image
        value: ""
      - name: retain
        value: "10"
      - name: registryUrl
        value: "https://docker-registry.hankeln.work"
  templates:
    - name: cleanup
      inputs:
        parameters:
          - name: image
          - name: retain
            value: "10"
          - name: registryUrl
            value: "https://docker-registry.hankeln.work"
      metadata:
        labels:
          network-policy/egress-dns: "true"
          network-policy/egress-world: "true"
          network-policy/egress-ingress-controller: "true"
      script:
        image: python:3.12-slim
        command: [python3]
        source: |
          import json
          import sys
          import urllib.request
          import urllib.error

          REGISTRY = "{{inputs.parameters.registryUrl}}"
          IMAGE = "{{inputs.parameters.image}}"
          RETAIN = int("{{inputs.parameters.retain}}")

          ACCEPT = ", ".join([
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def log(msg): print(msg, flush=True)

          def api_get(url, accept=None):
              req = urllib.request.Request(url)
              if accept:
                  req.add_header("Accept", accept)
              log(f"  GET {url}")
              with urllib.request.urlopen(req) as r:
                  # Read digest from HTTPMessage directly — it's case-insensitive,
                  # dict(r.headers) is not and will miss the header.
                  digest = r.headers.get("Docker-Content-Digest", "")
                  body = json.loads(r.read())
              return digest, body

          log("=" * 60)
          log(f"Registry : {REGISTRY}")
          log(f"Image    : {IMAGE}")
          log(f"Retain   : {RETAIN} most recent tag(s)")
          log("=" * 60)

          log(f"\n[1/3] Listing tags for {IMAGE} ...")
          _, body = api_get(f"{REGISTRY}/v2/{IMAGE}/tags/list")
          tags = body.get("tags") or []
          log(f"Found {len(tags)} tag(s): {', '.join(tags) if tags else '(none)'}")

          if not tags:
              log("No tags found, nothing to do.")
              sys.exit(0)

          if len(tags) <= RETAIN:
              log(f"\n{len(tags)} tag(s) present, retain={RETAIN} — nothing to delete.")
              sys.exit(0)

          log(f"\n[2/3] Fetching creation timestamps for {len(tags)} tag(s) ...")
          entries = []
          for i, tag in enumerate(tags, 1):
              log(f"  [{i}/{len(tags)}] {tag}")
              digest, manifest = api_get(f"{REGISTRY}/v2/{IMAGE}/manifests/{tag}", ACCEPT)
              log(f"    -> digest: {digest[:32]}..." if digest else "    -> digest: (empty!)")
              if "config" not in manifest:
                  log(f"    -> manifest list or unsupported format, will treat as oldest")
                  entries.append(("", tag, digest))
                  continue
              config_digest = manifest["config"]["digest"]
              _, config = api_get(f"{REGISTRY}/v2/{IMAGE}/blobs/{config_digest}")
              created = config.get("created", "(unknown)")
              log(f"    -> created: {created}")
              entries.append((created, tag, digest))

          entries.sort()
          log(f"\nSorted order (oldest first):")
          for created, tag, digest in entries:
              log(f"  {created or '(unknown)':35s}  {tag}")

          to_keep   = entries[-RETAIN:]
          to_delete = entries[: max(0, len(entries) - RETAIN)]
          log(f"\nKeeping : {[t for _, t, _ in to_keep]}")
          log(f"Deleting: {[t for _, t, _ in to_delete]}")

          log(f"\n[3/3] Deleting {len(to_delete)} tag(s) ...")
          for idx, (created, tag, digest) in enumerate(to_delete, 1):
              log(f"  [{idx}/{len(to_delete)}] {IMAGE}:{tag}")
              log(f"    digest : {digest}")
              log(f"    created: {created or '(unknown)'}")
              if not digest:
                  log("    -> Error: digest is empty, cannot delete. Aborting.")
                  sys.exit(1)
              req = urllib.request.Request(
                  f"{REGISTRY}/v2/{IMAGE}/manifests/{digest}", method="DELETE"
              )
              try:
                  urllib.request.urlopen(req)
                  log(f"    -> Deleted.")
              except urllib.error.HTTPError as e:
                  log(f"    -> Error: HTTP {e.code} {e.reason}")
                  sys.exit(1)

          log(f"\nDone. Deleted {len(to_delete)} tag(s), kept {len(to_keep)} most recent.")
