apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-main
  namespace: renovate-operator
spec:
  templateRef:
    name: default
  metadata:
    labels:
      network-policy/egress-ingress-controller: "true"
      network-policy/egress-cluster-port-6379: "true"
      network-policy/egress-cluster-port-8080: "true"
      network-policy/egress-world: "true"
      network-policy/egress-dns: "true"
  schedule: "0 6-23 * * *"
  discoveryFilters:
    - "Hankeln/*"
  secretRef: "renovate-secrets"
  provider:
    name: gitea
    endpoint: "https://git.hankeln.work"
  extraEnv:
    - name: RENOVATE_ALLOW_PLUGINS
      value: "true"
    - name: RENOVATE_ALLOWED_POST_UPGRADE_COMMANDS
      value: '["^\\.talos/scripts/3-get-image\\.sh$"]'
    - name: RENOVATE_DEPENDENCY_DASHBOARD
      value: |
        {
          "enabled": true,
          "autoclose": false,
          "title": "Dependency Dashboard",
          "header": "This issue lists Renovate updates and detected dependencies.",
          "footer": "- [ ] <!-- manual job -->Check this box to trigger a request for Renovate to run again on this repository",
          "osvVulnerabilitySummary": "all",
          "reportAbandonment": true,
          "pinned": true,
          "customize": {}
        }
  webhook:
    enabled: true
    sync:
      enabled: true
