apiVersion: v1
kind: ConfigMap
metadata:
  name: movement-detector-script
  namespace: webservice
data:
  script.py: |

    #!/usr/bin/env python3
    """
    Motion detection from MJPEG stream.
    Saves a 5-second video clip to the output directory whenever motion is detected.
    """

    import cv2
    import collections
    import os
    import time
    import argparse
    from datetime import datetime

    STREAM_URL = "http://192.168.1.121:1984/api/stream.mjpeg?src=webcam"
    OUTPUT_DIR = "captures"
    DEFAULT_FPS = 15.0          # fallback if stream doesn't report FPS

    # Tuning knobs
    MOTION_THRESHOLD = 1500     # min changed pixels to trigger
    BLUR_SIZE = 7               # gaussian blur kernel (must be odd)
    COOLDOWN_SECS = 2.0         # min seconds between end of last clip and start of next
    DILATE_ITERS = 2            # dilation passes to merge nearby blobs
    CLIP_DURATION = 5.0         # seconds of video per motion event
    PRE_BUFFER_SECS = 2.0       # seconds of pre-motion frames included in clip
    MAX_VIDEOS = 100            # oldest files deleted when this limit is exceeded


    def open_stream(url: str) -> cv2.VideoCapture:
        cap = cv2.VideoCapture(url)
        if not cap.isOpened():
            raise RuntimeError(f"Cannot open stream: {url}")
        return cap


    def get_fps(cap: cv2.VideoCapture) -> float:
        fps = cap.get(cv2.CAP_PROP_FPS)
        return fps if fps and fps > 0 else DEFAULT_FPS


    def cleanup_old_videos(output_dir: str, max_videos: int):
        files = sorted(
            (f for f in os.scandir(output_dir) if f.name.endswith(".mp4")),
            key=lambda f: f.stat().st_mtime,
        )
        for f in files[: max(0, len(files) - max_videos)]:
            os.remove(f.path)


    def make_writer(output_dir: str, frame_shape, fps: float) -> tuple:
        ts = datetime.now().strftime("%Y%m%d_%H%M%S")
        path = os.path.join(output_dir, f"motion_{ts}.mp4")
        h, w = frame_shape[:2]
        fourcc = cv2.VideoWriter_fourcc(*"mp4v")
        writer = cv2.VideoWriter(path, fourcc, fps, (w, h))
        return writer, path


    def run(url: str, output_dir: str, threshold: int, cooldown: float, max_videos: int):
        os.makedirs(output_dir, exist_ok=True)
        print(f"Connecting to {url}")
        cap = open_stream(url)
        fps = get_fps(cap)
        pre_buffer_size = int(PRE_BUFFER_SECS * fps)
        clip_frames_total = int(CLIP_DURATION * fps)

        prev_gray = None
        last_save = 0.0
        frame_count = 0
        pre_buffer = collections.deque(maxlen=pre_buffer_size)
        writer = None
        clip_frames_written = 0
        clip_path = ""

        print(
            f"Stream FPS: {fps:.1f}  |  clip: {CLIP_DURATION}s ({clip_frames_total} frames)  |  "
            f"pre-buffer: {PRE_BUFFER_SECS}s ({pre_buffer_size} frames)"
        )
        print(f"Motion threshold: {threshold} px, cooldown: {cooldown:.1f}s")
        print(f"Streaming — saves go to {output_dir}  (Ctrl+C to stop)")

        try:
            while True:
                ret, frame = cap.read()
                if not ret:
                    print("Stream lost, reconnecting in 3s…")
                    if writer:
                        writer.release()
                        writer = None
                    cap.release()
                    time.sleep(3)
                    cap = open_stream(url)
                    fps = get_fps(cap)
                    prev_gray = None
                    pre_buffer.clear()
                    print("Reconnected.")
                    continue

                frame_count += 1

                # If recording, write frame and check if clip is complete
                if writer is not None:
                    writer.write(frame)
                    clip_frames_written += 1
                    if clip_frames_written >= clip_frames_total:
                        writer.release()
                        writer = None
                        last_save = time.time()
                        print(f"  Saved: {clip_path}")
                        cleanup_old_videos(output_dir, max_videos)
                        pre_buffer.clear()

                # Motion detection
                gray = cv2.cvtColor(frame, cv2.COLOR_BGR2GRAY)
                gray = cv2.GaussianBlur(gray, (BLUR_SIZE, BLUR_SIZE), 0)

                if prev_gray is None:
                    prev_gray = gray
                    pre_buffer.append(frame)
                    continue

                diff = cv2.absdiff(prev_gray, gray)
                _, thresh = cv2.threshold(diff, 25, 255, cv2.THRESH_BINARY)
                thresh = cv2.dilate(thresh, None, iterations=DILATE_ITERS)

                changed_pixels = cv2.countNonZero(thresh)
                now = time.time()

                if changed_pixels > threshold and writer is None and (now - last_save) >= cooldown:
                    writer, clip_path = make_writer(output_dir, frame.shape, fps)
                    clip_frames_written = 0
                    print(
                        f"[{datetime.now().strftime('%H:%M:%S')}] Motion! {changed_pixels} px → {clip_path}"
                    )
                    for buf_frame in pre_buffer:
                        writer.write(buf_frame)
                        clip_frames_written += 1
                    writer.write(frame)
                    clip_frames_written += 1

                prev_gray = gray
                if writer is None:
                    pre_buffer.append(frame)

        except KeyboardInterrupt:
            print(f"\nStopped after {frame_count} frames. Captures in {output_dir}")
        finally:
            if writer:
                writer.release()
            cap.release()


    if __name__ == "__main__":
        parser = argparse.ArgumentParser(description="MJPEG motion detector — saves 5s video clips")
        parser.add_argument("--url", default=STREAM_URL, help="MJPEG stream URL")
        parser.add_argument("--out", default=OUTPUT_DIR, help="Output directory")
        parser.add_argument(
            "--threshold", type=int, default=MOTION_THRESHOLD,
            help="Min changed pixels to trigger (default %(default)s)",
        )
        parser.add_argument(
            "--cooldown", type=float, default=COOLDOWN_SECS,
            help="Seconds between clips (default %(default)s)",
        )
        parser.add_argument(
            "--max-videos", type=int, default=MAX_VIDEOS,
            help="Max video files to keep; oldest deleted automatically (default %(default)s)",
        )
        args = parser.parse_args()

        run(args.url, args.out, args.threshold, args.cooldown, args.max_videos)
