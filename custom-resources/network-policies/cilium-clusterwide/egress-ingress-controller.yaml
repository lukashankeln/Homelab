apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: egress-ingress-controller
spec:
  endpointSelector:
    matchLabels:
      network-policy/egress-ingress-controller: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: contour
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cilium
    # Cilium Gateway API: in-cluster calls to *.hankeln.work go through the gateway Envoy, which
    # enforces the caller's egress policy against the reserved "ingress" entity (403 "Access denied" otherwise)
    - toEntities:
        - ingress
