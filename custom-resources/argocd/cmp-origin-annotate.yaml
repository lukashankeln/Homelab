apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-origin-annotate
  # Must live in the argocd namespace so the repo-server sidecar can mount it,
  # even though this file is synced by the crds-argocd Application.
  namespace: argocd
data:
  # Config Management Plugin that stamps every rendered manifest with a
  # config.kubernetes.io/origin annotation pointing at its source file in git.
  # Only used by Applications whose source is a git directory of raw manifests
  # (opt-in via source.plugin.name). Helm/Kustomize/remote-chart apps are
  # untouched because they never reference this plugin.
  #
  # Implemented with busybox awk only, so the sidecar can run on a plain
  # docker.io/library/alpine image (no yq, no extra packages, no network).
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: origin-annotate
    spec:
      generate:
        command:
          - sh
          - -c
          - |
            set -eu
            # Repo-relative path of the source directory, passed in by the
            # Application via source.plugin.env (ARGOCD_ENV_*). Deterministic,
            # so the plugin does not depend on .git being present in the sidecar.
            base="${ARGOCD_ENV_SOURCE_SUBPATH:-.}"
            find . -type f \( -name '*.yaml' -o -name '*.yml' \) | LC_ALL=C sort | while IFS= read -r f; do
              rel="${f#./}"
              printf '%s\n' '---'
              awk -v file="${base}/${rel}" '
                function flush_doc(   i, mi, ai) {
                  # find the top-level (column 0) resource metadata block
                  mi=0
                  for (i=1;i<=dc;i++){ if (arr[i] ~ /^metadata:[ \t]*$/){ mi=i; break } }
                  if (mi>0) {
                    # does that metadata block already have a block-style annotations map?
                    ai=0
                    for (i=mi+1;i<=dc;i++){
                      if (arr[i] ~ /^[^ \t]/) break                    # left the metadata block
                      if (arr[i] ~ /^  annotations:[ \t]*$/){ ai=i; break }
                      if (arr[i] ~ /^  annotations:/){ ai=-1; break }  # inline map: leave untouched
                    }
                    for (i=1;i<=dc;i++){
                      print arr[i]
                      if (i==mi && ai==0) {
                        print "  annotations:"
                        print "    config.kubernetes.io/origin: |"
                        print "      path: " file
                      }
                      if (i==ai && ai>0) {
                        print "    config.kubernetes.io/origin: |"
                        print "      path: " file
                      }
                    }
                  } else {
                    for (i=1;i<=dc;i++) print arr[i]
                  }
                  dc=0
                }
                /^---[ \t]*$/ { flush_doc(); print; next }
                { arr[++dc]=$0 }
                END { if (dc>0) flush_doc() }
              ' "$f"
            done
