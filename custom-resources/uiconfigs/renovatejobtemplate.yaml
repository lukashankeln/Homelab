apiVersion: mogenius.com/v1alpha1
kind: UIConfig
metadata:
  name: renovatejobtemplate.renovate-operator.mogenius.com
spec:
  displayName: Renovate Job Template
  isCustomized: true
  reference:
    apiVersion: renovate-operator.mogenius.com/v1alpha1
    kind: RenovateJobTemplate
  schema:
    sections:
      - label: Metadata
        fields:
          - key: metadata.name
            label: Name
            type: string
            required: true
          - key: metadata.namespace
            label: Namespace
            type: string
            required: true
            default: renovate-operator

      - label: Image
        description: Renovate container image settings
        fields:
          - key: spec.image
            label: Image
            type: string
            required: true
            default: renovate/renovate:latest
            description: "Full image reference including tag (e.g. renovate/renovate:44.115.13)"

      - label: Scaling
        fields:
          - key: spec.parallelism
            label: Parallelism
            type: integer
            default: 2
            description: Maximum number of concurrent Renovate jobs

      - label: Resources
        description: CPU and memory requests/limits for Renovate pods
        fields:
          - key: spec.resources
            label: Resources
            type: resources

      - label: Webhook
        fields:
          - key: spec.webhook.enabled
            label: Enabled
            type: boolean
            default: true

      - label: Pod Labels
        description: Labels applied to all pods spawned from this template
        fields:
          - key: spec.metadata.labels
            label: Labels
            type: map
