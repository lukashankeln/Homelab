apiVersion: mogenius.com/v1alpha1
kind: UIConfig
metadata:
  name: clustersecretstore.external-secrets.io
spec:
  displayName: Cluster Secret Store
  isCustomized: true
  reference:
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
  schema:
    sections:
      - label: Metadata
        fields:
          - key: metadata.name
            label: Name
            type: string
            required: true

      - label: Provider
        description: "Backend provider configuration. See https://external-secrets.io/latest/api/clustersecretstore/ for all supported providers and their options."
        fields:
          - key: spec.provider
            label: Provider
            type: yaml

      - label: Retry Settings
        description: Controls how the operator retries failed secret fetches
        fields:
          - key: spec.retrySettings.maxRetries
            label: Max Retries
            type: integer
          - key: spec.retrySettings.retryInterval
            label: Retry Interval
            type: string
            description: "Duration between retries (e.g. 1m, 30s)"

      - label: Namespace Conditions
        description: Restrict which namespaces may reference this store (unrestricted if empty)
        fields:
          - key: spec.conditions
            label: Conditions
            type: objectArray
            fields:
              - key: namespaces
                label: Namespaces
                type: array
                description: Explicit list of allowed namespace names
              - key: namespaceRegexes
                label: Namespace Regexes
                type: array
                description: Regex patterns matched against namespace names
