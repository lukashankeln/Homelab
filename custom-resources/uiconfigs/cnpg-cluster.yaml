apiVersion: mogenius.com/v1alpha1
kind: UIConfig
metadata:
  name: cluster.postgresql.cnpg.io
spec:
  displayName: CNPG Cluster
  isCustomized: true
  reference:
    apiVersion: postgresql.cnpg.io/v1
    kind: Cluster
  schema:
    sections:
      - label: Metadata
        fields:
          - key: metadata.name
            label: Name
            type: string
            required: true
          - key: metadata.namespace
            label: Namespace
            type: string
            required: true

      - label: Cluster
        description: Core PostgreSQL cluster settings
        fields:
          - key: spec.instances
            label: Instances
            type: integer
            required: true
            default: 1
            description: Number of PostgreSQL instances (1 = single, 3+ = HA)
          - key: spec.logLevel
            label: Log Level
            type: string
            enum:
              - error
              - warning
              - info
              - debug
            default: warning
          - key: spec.primaryUpdateStrategy
            label: Primary Update Strategy
            type: string
            enum:
              - unsupervised
              - supervised
            default: unsupervised
            description: "unsupervised: operator handles failover automatically; supervised: manual promotion required"
          - key: spec.enableSuperuserAccess
            label: Enable Superuser Access
            type: boolean
            default: false
            description: Expose the postgres superuser credentials via a secret

      - label: Image
        description: PostgreSQL image source via catalog reference
        fields:
          - key: spec.imageCatalogRef.kind
            label: Catalog Kind
            type: string
            enum:
              - ClusterImageCatalog
              - ImageCatalog
            default: ClusterImageCatalog
          - key: spec.imageCatalogRef.name
            label: Catalog Name
            type: string
            required: true
            default: postgresql
          - key: spec.imageCatalogRef.major
            label: PostgreSQL Major Version
            type: integer
            required: true
            default: 17

      - label: Bootstrap
        description: Database initialisation settings (only applied on first boot)
        fields:
          - key: spec.bootstrap.initdb.database
            label: Database Name
            type: string
            required: true
          - key: spec.bootstrap.initdb.owner
            label: Owner Role
            type: string
            description: PostgreSQL role that owns the database (created automatically)

      - label: Managed Roles
        description: Additional PostgreSQL roles managed by the operator
        fields:
          - key: spec.managed.roles
            label: Roles
            type: objectArray
            fields:
              - key: name
                label: Name
                type: string
                required: true
              - key: superuser
                label: Superuser
                type: boolean
                default: false
              - key: createdb
                label: Create DB
                type: boolean
                default: false
              - key: login
                label: Login
                type: boolean
                default: true

      - label: Resources
        description: CPU and memory requests/limits for PostgreSQL pods
        fields:
          - key: spec.resources
            label: Resources
            type: resources

      - label: Storage
        fields:
          - key: spec.storage.size
            label: Data Volume Size
            type: string
            required: true
            default: "1Gi"
            description: PVC size for PostgreSQL data
          - key: spec.walStorage.size
            label: WAL Volume Size
            type: string
            default: "1Gi"
            description: Separate PVC for WAL files (recommended for HA clusters)

      - label: PostgreSQL Parameters
        description: postgresql.conf parameters passed directly to the server
        fields:
          - key: spec.postgresql.parameters
            label: Parameters
            type: map

      - label: Monitoring
        fields:
          - key: spec.monitoring.enablePodMonitor
            label: Enable Pod Monitor
            type: boolean
            default: true
            description: Create a PodMonitor for Prometheus scraping
