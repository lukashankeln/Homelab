apiVersion: mogenius.com/v1alpha1
kind: UIConfig
metadata:
  name: externalsecret.external-secrets.io
spec:
  displayName: External Secret
  isCustomized: true
  reference:
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
  schema:
    sections:
      - label: Metadata
        fields:
          - key: metadata.name
            label: Name
            type: string
            required: true
          - key: metadata.namespace
            label: Namespace
            type: string
            required: true

      - label: Secret Store
        fields:
          - key: spec.secretStoreRef.name
            label: Store Name
            type: string
            required: true
            default: vault-backend
          - key: spec.secretStoreRef.kind
            label: Store Kind
            type: string
            required: true
            enum:
              - ClusterSecretStore
              - SecretStore
            default: ClusterSecretStore
          - key: spec.refreshInterval
            label: Refresh Interval
            type: string
            default: "10s"
            description: How often to sync the secret from the remote store

      - label: Data Mappings
        description: Fields to pull from the remote store into the Kubernetes secret
        fields:
          - key: spec.data
            label: Data
            type: objectArray
            fields:
              - key: remoteRef.key
                label: Remote Key
                type: string
                required: true
                description: "Path in the secret store (e.g. /renovate)"
              - key: remoteRef.property
                label: Remote Property
                type: string
                description: Property/field within the remote key
              - key: secretKey
                label: Secret Key
                type: string
                required: true
                description: Key name in the resulting Kubernetes secret

      - label: Target
        description: Configuration for the generated Kubernetes secret
        fields:
          - key: spec.target.name
            label: Secret Name
            type: string
            description: Name of the generated secret (defaults to ExternalSecret name)
          - key: spec.target.creationPolicy
            label: Creation Policy
            type: string
            enum:
              - Owner
              - Orphan
              - Merge
              - None
            default: Owner
          - key: spec.target.deletionPolicy
            label: Deletion Policy
            type: string
            enum:
              - Delete
              - Merge
              - Retain
            default: Merge

      - label: Template
        description: Static data and merge policy for the generated secret
        fields:
          - key: spec.target.template.mergePolicy
            label: Merge Policy
            type: string
            enum:
              - Replace
              - Merge
              - Extract
          - key: spec.target.template.data
            label: Static Data
            type: map
            description: Static key-value pairs merged into the generated secret

      - label: Template Labels
        description: Labels applied to the generated Kubernetes secret
        fields:
          - key: spec.target.template.metadata.labels
            label: Labels
            type: map
